<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Diamond Shell Switch</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #080808;
        --surface: #111113;
        --line: #29292f;
        --text: #f4f4f5;
        --muted: #a4a4aa;
        --accent: #f5f5f7;
      }

      * {
        box-sizing: border-box;
      }

      body {
        align-items: center;
        background: var(--bg);
        color: var(--text);
        display: grid;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        margin: 0;
        min-height: 100vh;
        padding: 24px;
      }

      main {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 12px;
        margin: auto;
        max-width: 680px;
        padding: 28px;
        width: 100%;
      }

      h1 {
        font-size: 30px;
        letter-spacing: 0;
        line-height: 1.1;
        margin: 0;
      }

      p {
        color: var(--muted);
        font-weight: 750;
        line-height: 1.45;
        margin: 12px 0 0;
      }

      nav {
        display: grid;
        gap: 12px;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        margin-top: 24px;
      }

      a {
        background: #19191d;
        border: 1px solid var(--line);
        border-radius: 8px;
        color: var(--text);
        display: grid;
        font-weight: 900;
        gap: 6px;
        min-height: 92px;
        padding: 16px;
        text-decoration: none;
      }

      a:hover,
      a:focus-visible {
        border-color: var(--accent);
        outline: none;
      }

      a span {
        color: var(--muted);
        font-size: 13px;
        font-weight: 750;
        line-height: 1.35;
      }

      @media (max-width: 680px) {
        nav {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main aria-labelledby="shell-heading">
      <h1 id="shell-heading">Diamond shell switch</h1>
      <p>Loading your selected Diamond shell. The legacy shell remains available while the Diamond-style shell is wired into production.</p>
      <nav aria-label="Diamond shell routes">
        <a href="./legacy-shell.html" data-shell-link="legacy">
          Legacy shell
          <span>Current working renderer with full browser staging controls.</span>
        </a>
        <a href="./posts-prototype.html" data-shell-link="diamond">
          Diamond shell
          <span>New posts-first prototype shell for production integration.</span>
        </a>
      </nav>
    </main>
    <script type="module" src="./shell-switch.js"></script>
  </body>
</html>
